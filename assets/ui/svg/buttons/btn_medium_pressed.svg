<svg xmlns="http://www.w3.org/2000/svg" width="150" height="38" viewBox="0 0 150 38">
  <defs>
    <filter id="glow-pressed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Flash background - white overlay -->
  <rect x="4" y="4" width="142" height="30" rx="8" ry="8"
        fill="#ffffff" fill-opacity="0.3"/>

  <!-- Outer glow layer 2 - flash -->
  <rect x="0" y="0" width="150" height="38" rx="10" ry="10"
        fill="none" stroke="#00ffff" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Outer glow layer 1 - flash -->
  <rect x="2" y="2" width="146" height="34" rx="9" ry="9"
        fill="none" stroke="#00ffff" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Main border - full brightness -->
  <rect x="4" y="4" width="142" height="30" rx="8" ry="8"
        fill="none" stroke="#00ffff" stroke-width="2" stroke-opacity="1"
        filter="url(#glow-pressed)"/>
</svg>