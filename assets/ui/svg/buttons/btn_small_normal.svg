<svg xmlns="http://www.w3.org/2000/svg" width="100" height="32" viewBox="0 0 100 32">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background fill -->
  <rect x="4" y="4" width="92" height="24" rx="6" ry="6"
        fill="#0d1b2a" fill-opacity="0.15"/>

  <!-- Outer glow layer 2 -->
  <rect x="0" y="0" width="100" height="32" rx="8" ry="8"
        fill="none" stroke="#00ffff" stroke-width="1.5" stroke-opacity="0.08"/>

  <!-- Outer glow layer 1 -->
  <rect x="2" y="2" width="96" height="28" rx="7" ry="7"
        fill="none" stroke="#00ffff" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Main border -->
  <rect x="4" y="4" width="92" height="24" rx="6" ry="6"
        fill="none" stroke="#00ffff" stroke-width="2" stroke-opacity="0.7"
        filter="url(#glow)"/>
</svg>