<svg xmlns="http://www.w3.org/2000/svg" width="260" height="160" viewBox="0 0 260 160">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow layer 2 -->
  <rect x="0" y="0" width="260" height="160" rx="12" ry="12"
        fill="none" stroke="#00ffff" stroke-width="1.5" stroke-opacity="0.13"/>

  <!-- Outer glow layer 1 -->
  <rect x="2" y="2" width="256" height="156" rx="10" ry="10"
        fill="none" stroke="#00ffff" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Background fill -->
  <rect x="4" y="4" width="252" height="152" rx="8" ry="8"
        fill="#0d1b2a" fill-opacity="1"/>

  <!-- Main border -->
  <rect x="4" y="4" width="252" height="152" rx="8" ry="8"
        fill="none" stroke="#00ffff" stroke-width="2" stroke-opacity="1"
        filter="url(#glow)"/>
</svg>