<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Top-right corner accent -->

  <!-- Main corner lines (2px, 60% opacity) -->
  <path d="M 0 0 L 40 0 L 40 40"
        fill="none" stroke="#00ffff" stroke-width="2" stroke-opacity="0.6"
        stroke-linecap="square"/>

  <!-- Inner accent lines (1px, 30% opacity, offset 5px) -->
  <path d="M 5 5 L 35 5 L 35 35"
        fill="none" stroke="#00ffff" stroke-width="1" stroke-opacity="0.3"
        stroke-linecap="square"/>
</svg>